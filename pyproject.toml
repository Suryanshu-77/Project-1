[project]
name = "tierwise"
version = "0.9.1"
description = "Cost-aware, self-hosted LLM gateway with a learned router"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "models/router/NOTICE"]
authors = [{ name = "Suryanshu" }]
keywords = ["llm", "gateway", "router", "openai", "anthropic", "gemini", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "aiosqlite>=0.22.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "asyncpg>=0.30",
]

[project.urls]
Repository = "https://github.com/Suryanshu-77/Project-1"
Benchmark = "https://github.com/Suryanshu-77/Project-1/blob/main/BENCHMARK.md"
Changelog = "https://github.com/Suryanshu-77/Project-1/blob/main/CHANGELOG.md"

[project.scripts]
tierwise = "tierwise.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "openai>=1.40",
    "types-pyyaml>=6.0.12.20261030",
]
retrain = [  # the flywheel's retrain + gate: the gateway's own encoder, plus scikit-learn
    "scikit-learn>=1.5",
]
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3",
    "scikit-learn>=1.5",
    "huggingface_hub>=0.24",
    "onnx>=1.16",
    "matplotlib>=3.9",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tierwise"]

# the default registry and the small router artifacts ship in the wheel; model.onnx is fetched
[tool.hatch.build.targets.wheel.force-include]
"config/registry.yaml" = "tierwise/data/registry.yaml"
"models/router/classifier.npz" = "tierwise/data/router/classifier.npz"
"models/router/router.json" = "tierwise/data/router/router.json"
"models/router/tokenizer.json" = "tierwise/data/router/tokenizer.json"
"models/router/NOTICE" = "tierwise/data/router/NOTICE"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true
