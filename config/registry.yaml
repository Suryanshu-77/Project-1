# tierwise model registry. Prices are USD per 1M tokens.
#
# Prices looked up 2026-11-01 from third-party pricing trackers; the official pages
# (platform.claude.com, platform.openai.com/pricing, ai.google.dev/pricing) could not be
# checked from here. VERIFY against the official pages before trusting cost reports.
# Long-context surcharges (e.g. >200K tokens on Gemini Pro) are not modeled yet.
#
# quality: uncalibrated until M5 (placeholder values, ordered by tier).
#
# cache_ttl_s marks models whose prompt cache conversation affinity can count on. OpenAI and
# Gemini cache prompt prefixes automatically; Anthropic only caches when a request sets
# cache_control, which the gateway doesn't do yet, so its models have no TTL.

baseline_model: claude-opus-5-5

models:
  # --- Anthropic ---
  - id: claude-haiku-5-5
    provider: anthropic
    price_in: 0.10
    price_out: 0.50
    price_cache_read: 0.01
    price_cache_write: 0.125
    context: 200000
    caps: [tools, vision, json]
    quality: 0.60
    tier: basic

  - id: claude-sonnet-5-5
    provider: anthropic
    price_in: 2.00
    price_out: 10.00
    price_cache_read: 0.10
    price_cache_write: 2.50
    context: 200000
    caps: [tools, vision, json]
    quality: 0.80
    tier: moderate

  - id: claude-opus-5-5
    provider: anthropic
    price_in: 4.00
    price_out: 20.00
    price_cache_read: 0.20
    price_cache_write: 5.00
    context: 200000
    caps: [tools, vision, json]
    quality: 0.95
    tier: flagship

  # --- OpenAI (prompt caching is automatic; no write charge) ---
  - id: gpt-4.1-nano
    provider: openai
    price_in: 0.10
    price_out: 0.40
    price_cache_read: 0.025
    cache_ttl_s: 300
    context: 1000000
    caps: [tools, vision, json]
    quality: 0.45
    tier: basic

  - id: gpt-5.4
    provider: openai
    price_in: 2.50
    price_out: 15.00
    price_cache_read: 0.25
    cache_ttl_s: 300
    context: 400000
    caps: [tools, vision, json]
    quality: 0.80
    tier: moderate

  - id: gpt-5.5
    provider: openai
    price_in: 5.00
    price_out: 30.00
    price_cache_read: 0.50
    cache_ttl_s: 300
    context: 400000
    caps: [tools, vision, json]
    quality: 0.93
    tier: flagship

  # --- Google Gemini (implicit caching; no write charge) ---
  - id: gemini-3-flash
    provider: gemini
    price_in: 0.50
    price_out: 3.00
    price_cache_read: 0.05
    cache_ttl_s: 300
    context: 1000000
    caps: [tools, vision, json]
    quality: 0.65
    tier: basic

  - id: gemini-3.1-pro
    provider: gemini
    price_in: 2.00
    price_out: 12.00
    price_cache_read: 0.20
    cache_ttl_s: 300
    context: 1000000
    caps: [tools, vision, json]
    quality: 0.90
    tier: flagship

  # --- Local (Ollama) ---
  - id: ollama/llama3.2
    provider: ollama
    upstream_id: llama3.2
    price_in: 0
    price_out: 0
    context: 128000
    caps: [tools, json]
    quality: 0.35
    tier: basic
