# tierwise model registry. Prices are USD per 1M tokens.
#
# Prices looked up 2026-11-01 from third-party pricing trackers; the official pages
# (platform.claude.com, platform.openai.com/pricing, ai.google.dev/pricing) could not be
# checked from here. VERIFY against the official pages before trusting cost reports.
# Long-context surcharges (e.g. >200K tokens on Gemini Pro) are not modeled yet.
#
# quality: uncalibrated until M5 (placeholder values, ordered by tier).
#
# efforts: reasoning-effort levels the model accepts (tierwise scale: minimal, low, medium,
# high, xhigh, max). Each level shifts quality (0 at the provider default; -0.15 per scale
# step below it, +0.03 per step above), measured at difficulty 0.5: tierwise scales the
# penalties with each request's difficulty. Estimates thinking tokens. Uncalibrated until M5.
# Level lists for OpenAI and Gemini come from third-party docs: VERIFY against the official
# API references. effort_in_cache_key: true where changing effort invalidates the cache.
#
# cache_ttl_s marks models whose prompt cache conversation affinity can count on. OpenAI and
# Gemini cache prompt prefixes automatically; Anthropic only caches when a request sets
# cache_control, which the gateway doesn't do yet, so its models have no TTL.

baseline_model: claude-opus-5-5

models:
  # --- Anthropic ---
  - id: claude-haiku-5-5
    provider: anthropic
    price_in: 0.10
    price_out: 0.50
    price_cache_read: 0.01
    price_cache_write: 0.125
    context: 200000
    caps: [tools, vision, json]
    quality: 0.60
    tier: basic
    effort_in_cache_key: true
    efforts:
      default: medium
      levels:
        low: {quality: -0.15, thinking_tokens: 150}
        medium: {quality: +0.00, thinking_tokens: 600}
        high: {quality: +0.03, thinking_tokens: 2000}

  - id: claude-sonnet-5-5
    provider: anthropic
    price_in: 2.00
    price_out: 10.00
    price_cache_read: 0.10
