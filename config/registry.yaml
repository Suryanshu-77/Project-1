    context: 200000
    caps: [tools, vision, json]
    quality: 0.80
    tier: moderate
    effort_in_cache_key: true
    efforts:
      default: high
      levels:
        low: {quality: -0.30, thinking_tokens: 150}
        medium: {quality: -0.15, thinking_tokens: 600}
        high: {quality: +0.00, thinking_tokens: 2000}

  - id: claude-opus-5-5
    provider: anthropic
    price_in: 4.00
